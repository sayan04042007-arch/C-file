<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Concept Simplifier</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8 flex flex-col items-center">

    <div class="max-w-md w-full space-y-4">
        <h1 class="text-2xl font-bold text-cyan-400">🎓 Exam Concept Simplifier</h1>
        
        <!-- 1. API KEY INPUT (Visible & Auto-saved) -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Your Gemini API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your AIzaSy... key" 
                class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm">
        </div>

        <!-- 2. TOPIC INPUT BOX -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Difficult Topic:</label>
            <input type="text" id="topicInput" placeholder="e.g. Recursion, Photosynthesis, Black Holes..." 
                class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white">
        </div>

        <!-- 3. BUTTON -->
        <button id="submitBtn" onclick="simplifyTopic()" 
            class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold p-3 rounded-lg transition">
            Simplify This For Me
        </button>

        <!-- 4. OUTPUT DISPLAY BOX -->
        <div id="outputArea" class="p-4 bg-slate-800 border border-slate-700 rounded-lg min-h-[120px] text-slate-200 whitespace-pre-wrap leading-relaxed text-sm">
            Your simplified explanation will appear here...
        </div>
    </div>

    <script>
        // When the page opens, auto-fill the API key if you used it before
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        async function simplifyTopic() {
            // REFLEX 1: GRAB WHAT THE USER TYPED
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const userTopic = document.getElementById('topicInput').value.trim();
            const output = document.getElementById('outputArea');
            const button = document.getElementById('submitBtn');

            // VALIDATION
            if (!apiKey) {
                alert("Please paste your Gemini API Key in the box!");
                return;
            }
            if (!userTopic) {
                alert("Please enter a topic to simplify!");
                return;
            }

            // Save key in localStorage so you never have to re-type it
            localStorage.setItem('gemini_api_key', apiKey);

            // REFLEX 4 (Part 1): PAINT LOADING STATE
            button.disabled = true;
            button.innerText = "⏳ Simplifying...";
            output.innerText = "Connecting to Gemini 3.8 Flash to break down " + userTopic + "...";

            // INSTRUCTIONS FOR AI
            const prompt = `Explain the concept of "${userTopic}" in 2 simple sentences so a beginner can understand it. Then provide:
1. 💡 A REAL-WORLD ANALOGY
2. ❓ ONE PRACTICE EXAM QUESTION`;

            // REFLEX 3: SEND TO GEMINI (API CALL)
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            thinkingConfig: { thinkingBudget: 0 }
                        }
                    })
                });

                const data = await response.json();

                if (data.error) {
                    output.innerText = "❌ Google Error: " + data.error.message;
                    return;
                }

                // REFLEX 4 (Part 2): EXTRACT & PAINT THE ANSWER
                const parts = data.candidates?.[0]?.content?.parts || [];
                const reply = parts
                    .filter(p => p.text && !p.thought)
                    .map(p => p.text)
                    .join("\n") || parts.map(p => p.text).join("\n");

                output.innerText = reply;

            } catch (error) {
                output.innerText = "❌ Network error: " + error.message;
                console.error(error);
            } finally {
                // Re-enable the button
                button.disabled = false;
                button.innerText = "Simplify This For Me";
            }
        }
    </script>
</body>
</html>
